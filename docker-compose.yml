version: '3.8'

networks:
  katharos_net:
    driver: bridge

services:
  database:
    image: postgres:16-alpine
    container_name: katharos_db
    restart: unless-stopped
    networks:
      - katharos_net
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/HDD2TB-Dual/AppData/katharos/db_data:/var/lib/postgresql/data

  frontend:
    image: nginx:alpine
    container_name: katharos_frontend
    restart: unless-stopped
    networks:
      - katharos_net
    ports:
      - '3001:80'
